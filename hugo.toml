baseURL = "http://localhost:1313/"
languageCode = "en-us"
languageName = "English"
defaultContentLanguage = "en"
title = "Dron Security"
theme = "mana"

[pagination]
  pageSize = 10

[markup]
  [markup.tableOfContents]
    startLevel = 1
    endLevel = 6
    ordered = false

  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

    [markup.goldmark.parser]
      [markup.goldmark.parser.attribute]
        block = true
        title = true

  [markup.highlight]
    codeFences = true
    guessSyntax = true
    noClasses = false
    style = "catppuccin-macchiato"

[outputs]
  home = ["HTML", "JSON"]

[sitemap]
  changefreq = "weekly"
  priority = 0.5
  filename = "sitemap.xml"

[params]
  enableIntegrity = false
  relatedPostsCount = 3

  description = "Cybersecurity research, penetration testing, bug bounty, CTF writeups and security engineering."
  author = "Dron"
  heroTitleLine1 = "DRON SECURITY"
  heroTitleLine2 = "CYBERSECURITY • RESEARCH • OFFENSIVE SECURITY"
  footerText = "Built with Hugo and Mana"

  [params.social]
    github = "https://github.com/Dron29"
    linkedin = "https://www.linkedin.com/in/dronpatel29/"
    email = "dronpatel9@gmail.com"

  [params.codeHighlight]
    darkTheme = "catppuccin-macchiato"
    lightTheme = "catppuccin-frappe"

  [params.copyright]
    startYear = 2026
    owner = "Dron"

  [params.admonitions]
    alertStyle = "favicon"

[[menus.main]]
  name = "Home"
  pageRef = "/"
  weight = 10

[[menus.main]]
  name = "Posts"
  pageRef = "/posts"
  weight = 20

[[menus.main]]
  name = "Categories"
  pageRef = "/categories"
  weight = 30

[[menus.main]]
  name = "Tags"
  pageRef = "/tags"
  weight = 40

[[menus.main]]
  name = "About"
  pageRef = "/about"
  weight = 50